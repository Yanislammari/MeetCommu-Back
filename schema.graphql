scalar DateTime
scalar URL
scalar Email
scalar Password

enum Role {
  ADMIN
  USER
}

enum Visibility {
  PUBLIC
  PRIVATE
}

enum Status {
  PENDING
  ACCEPTED
  REJECTED
}

enum ReactionType {
  LIKE
  LOVE
  HAHA
  WOW
  SAD
  ANGRY
}

enum NotificationType {
  FRIEND_REQUEST
  MESSAGE
  POST_REACTION
  COMMENT
}

type User {
  id: ID!
  firstName: String!
  lastName: String!
  username: String!
  email: Email!
  password: Password!
  role: Role!
  visibility: Visibility!
  profilePictureUrl: URL
  createdAt: DateTime!
  updatedAt: DateTime!
  followers: [User!]!
  following: [User!]!
  followerRelations: [FollowRelation!]!
  followingRelations: [FollowRelation!]!
  followRequestsSent: [AskingFollowingRelation!]!
  followRequestsReceived: [AskingFollowingRelation!]!
  communities: [Community!]!
  communitiesAdminOf: [Community!]!
  communitiesCreated: [Community!]!
  followedCommunities: [Community!]!
  followCommunityRelations: [FollowCommunity!]!
  groups: [Group!]!
  groupsAdminOf: [Group!]!
  groupsCreated: [Group!]!
  conversations: [Conversation!]!
  messagesSent: [Message!]!
  messagesReceived: [Message!]!
  posts: [Post!]!
  articles: [Article!]!
  comments: [Comment!]!
  reactions: [Reaction!]!
  games: [Game!]!
  notifications: [Notification!]!
}

type Group {
  id: ID!
  name: String!
  users: [User!]!
  creator: User!
  admins: [User!]!
  pictureUrl: URL
  createdAt: DateTime!
  updatedAt: DateTime!
  communities: [Community!]!
  conversations: [Conversation!]!
}

type Community {
  id: ID!
  name: String!
  description: String
  users: [User!]!
  groups: [Group!]!
  games: [Game!]!
  articles: [Article!]!
  posts: [Post!]!
  pictureUrl: URL
  creator: User!
  admins: [User!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  followers: [User!]!
  followCommunityRelations: [FollowCommunity!]!
}

type Reaction {
  id: ID!
  type: ReactionType!
  user: User!
  createdAt: DateTime!
  updatedAt: DateTime!
  post: Post
  article: Article
}

type Post {
  id: ID!
  content: String!
  author: User!
  reactions: [Reaction!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  community: Community!
}

type Game {
  id: ID!
  title: String!
  description: String
  coverImageUrls: [URL!]
  creator: User!
  jsFileUrl: URL!
  createdAt: DateTime!
  updatedAt: DateTime!
  community: Community!
}

type Article {
  id: ID!
  title: String!
  content: String!
  author: User!
  pictureUrl: URL
  markdownFileUrl: URL!
  comments: [Comment!]!
  reactions: [Reaction!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  community: Community!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  createdAt: DateTime!
  updatedAt: DateTime!
  article: Article!
}

type FollowRelation {
  id: ID!
  follower: User!
  followed: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AskingFollowingRelation {
  id: ID!
  requester: User!
  requested: User!
  status: Status!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Message {
  id: ID!
  content: String!
  sender: User!
  receiver: User!
  createdAt: DateTime!
  updatedAt: DateTime!
  conversation: Conversation!
}

type Conversation {
  id: ID!
  participants: [User!]!
  messages: [Message!]!
  group: Group
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Notification {
  id: ID!
  type: NotificationType!
  recipient: User!
  content: String!
  isRead: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FollowCommunity {
  id: ID!
  user: User!
  community: Community!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input RegisterInput {
  firstName: String!
  lastName: String!
  username: String!
  email: Email!
  password: Password!
  role: Role = USER
}

input LoginInput {
  email: Email!
  password: Password!
}

input UpdateUserInput {
  firstName: String
  lastName: String
  username: String
  email: Email
  visibility: Visibility
}

input CreateCommunityInput {
  name: String!
  description: String
}

input UpdateCommunityInput {
  name: String
  description: String
}

type Mutation {
  register(input: RegisterInput!): String!
  login(input: LoginInput!): String!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
  createCommunity(input: CreateCommunityInput!): Community!
  updateCommunity(id: ID!, input: UpdateCommunityInput!): Community!
}

type Query {
  me: User!
  users: [User!]!
  user(id: ID!): User
  communities: [Community!]!
  community(id: ID!): Community
}
